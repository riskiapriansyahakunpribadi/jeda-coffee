<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144 40" fill="none" role="img" aria-label="jeda coffee">
  <!-- ============================================================
       BAGIAN   : Logo Utama Jeda Coffee (Warna Teal untuk Latar Terang)
       FUNGSI   : Menampilkan ikon Jeda (simbol pause di dalam kotak
                  membulat) dan wordmark "jeda" huruf kecil bersudut
                  membulat.
       CARA UBAH: Ganti nilai fill="#0B6E80" atau "#1E96AB" jika ingin
                  menyesuaikan warna logo.
       ============================================================ -->
  <rect x="2" y="4" width="32" height="32" rx="10" fill="#0B6E80" />
  <rect x="12.5" y="12" width="4" height="16" rx="2" fill="#FFFFFF" />
  <rect x="19.5" y="12" width="4" height="16" rx="2" fill="#CDEFF5" />
  <text x="44" y="28.5" font-family="&#39;Poppins&#39;, system-ui, -apple-system, sans-serif" font-size="27" font-weight="700" letter-spacing="-0.03em" fill="#08475A">jeda</text>
  <circle cx="114" cy="24.5" r="3.5" fill="#1E96AB" />
</svg>